<app-dialog title="Job Executions"
            [subtitle]="data.parameterName + ' · ' + data.parameterId"
            icon="history" badge>
  <!-- Fixed (not max-) height so the list scrolls internally and the dialog
       stays a consistent size whether a parameter has 3 runs or 24. -->
  <app-parameter-executions-list class="ped-list" [executions]="executions()">
  </app-parameter-executions-list>

  <ng-container dialogActions>
    <button mat-button (click)="ref.close()">Close</button>
  </ng-container>
</app-dialog>
