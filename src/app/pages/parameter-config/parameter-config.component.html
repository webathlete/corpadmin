<div>
  <app-page-layout [loading]="loading()" title="Parameter Configuration"
                   description="Manage system, validation, integration and workflow parameters."
                   [breadcrumbs]="[{ label: 'Home', link: '/dashboard' }, { label: 'Parameter Configuration' }]">
    <div class="pc-toolbar">
      <span class="pc-toolbar-label">CRUD style</span>
      <mat-button-toggle-group [value]="crudStyle()" (change)="crudStyle.set($event.value)"
                                hideSingleSelectionIndicator aria-label="CRUD interaction style">
        <mat-button-toggle value="dialog">
          <mat-icon>open_in_new</mat-icon> Dialog
        </mat-button-toggle>
        <mat-button-toggle value="inline">
          <mat-icon>view_sidebar</mat-icon> Inline Panel
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <mat-tab-group class="pc-tabs" [selectedIndex]="selectedIndex()"
                   (selectedIndexChange)="selectedIndex.set($event)" animationDuration="150ms">
      @for (g of groupTypes; track g.type; let i = $index) {
        <mat-tab [label]="g.label">
          <div class="pc-tab-body">
            @if (crudStyle() === 'dialog') {
              <app-data-table
                [columns]="columns"
                [data]="entriesByIndex()[i]"
                [rowActions]="rowActions"
                [loading]="loading()"
                [pageSize]="10"
                addLabel="Add Parameter"
                [showRefresh]="true"
                (add)="addNew()"
                (refresh)="refresh()"
                (rowAction)="onRowAction($event)">
              </app-data-table>
            } @else {
              <app-parameter-inline-panel [type]="g.type" [typeLabel]="g.label" [loading]="loading()"
                                         (refresh)="refresh()">
              </app-parameter-inline-panel>
            }
          </div>
        </mat-tab>
      }
    </mat-tab-group>
  </app-page-layout>
</div>
