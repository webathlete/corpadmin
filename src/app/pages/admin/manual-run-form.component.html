<form class="af-form" (ngSubmit)="run()" [formGroup]="form">
  <div class="af-row">
    <mat-form-field appearance="outline" class="af-grow">
      <mat-label>Job</mat-label>
      <mat-select formControlName="jobId">
        @for (j of jobs; track j.id) { <mat-option [value]="j.id">{{ j.name }}</mat-option> }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Environment</mat-label>
      <mat-select formControlName="environment">
        @for (e of environments; track e) { <mat-option [value]="e">{{ e }}</mat-option> }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Region</mat-label>
      <mat-select formControlName="region">
        @for (r of regions; track r) { <mat-option [value]="r">{{ r }}</mat-option> }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="af-row">
    <mat-form-field appearance="outline">
      <mat-label>Run date</mat-label>
      <input matInput [matDatepicker]="dp" formControlName="runDate" />
      <mat-datepicker-toggle matIconSuffix [for]="dp"></mat-datepicker-toggle>
      <mat-datepicker #dp></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="af-grow">
      <mat-label>Run name</mat-label>
      <input matInput formControlName="runName" placeholder="MonthEnd-Rerun-01" />
      <mat-error>Letters, digits, dashes and underscores only</mat-error>
    </mat-form-field>
  </div>

  <div class="af-actions">
    <button mat-button type="button" (click)="form.reset()">Reset</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      <mat-icon>play_arrow</mat-icon> Run job
    </button>
  </div>
</form>
